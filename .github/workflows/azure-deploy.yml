name: Deploy Angular SSR to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spisok-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spisok-frontend/package-lock.json

      - run: npm ci
      - run: npm run build -- --configuration production

      - name: Assemble deployment package
        run: |
          mkdir ../deploy
          cp -r dist ../deploy/dist
          cp package.json package-lock.json ../deploy/
          cd ../deploy
          npm ci --omit=dev

      - name: Verify server bundle
        run: test -f ../deploy/dist/spisok-frontend/server/server.mjs

      - uses: azure/webapps-deploy@v3
        with:
          app-name: spisok-frontend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
      
      