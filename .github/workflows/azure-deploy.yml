name: Deploy Angular SSR to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spisok-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v22-placeholder